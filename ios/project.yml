# XcodeGen spec for iDeck (generate with: xcodegen generate --spec ios/project.yml)
#
# The native dependencies (QEMU 10 utmapp fork, virglrenderer with Venus,
# MoltenVK, ANGLE, spice-gtk, GLib, GStreamer, ...) come from UTM's
# dependency build ("sysroot-iOS-arm64" or "sysroot-iOS-TCI-arm64"),
# placed next to this file by ios/scripts/fetch_sysroot.sh. Search paths are
# set at project level so the CocoaSpice Swift package sees the headers.
name: iDeck
options:
  bundleIdPrefix: com.ideck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Sysroot.xcconfig
  Release: Sysroot.xcconfig
settings:
  base:
    SYSROOT_DIR: "$(PROJECT_DIR)/sysroot-iOS$(IDECK_SYSROOT_SUFFIX)-arm64"
    FRAMEWORK_SEARCH_PATHS: ["$(SYSROOT_DIR)/Frameworks"]
    HEADER_SEARCH_PATHS:
      - "$(SYSROOT_DIR)/include"
      - "$(SYSROOT_DIR)/include/glib-2.0"
      - "$(SYSROOT_DIR)/lib/glib-2.0/include"
      - "$(SYSROOT_DIR)/include/gstreamer-1.0"
      - "$(SYSROOT_DIR)/include/spice-client-glib-2.0"
      - "$(SYSROOT_DIR)/include/spice-1"
      - "$(SYSROOT_DIR)/include/libusb-1.0"
      - "$(PROJECT_DIR)/../core/include"
    LIBRARY_SEARCH_PATHS: ["$(SYSROOT_DIR)/lib", "$(SYSROOT_DIR)/lib/gstreamer-1.0"]
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    GCC_C_LANGUAGE_STANDARD: gnu11
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IDECK_EDITION: jit
    IDECK_SYSROOT_SUFFIX: ""
    IDECK_BUNDLE_ID: com.ideck.app
    IDECK_APP_GROUP: group.$(IDECK_BUNDLE_ID)
    IDECK_MANIFEST_URL: ""
packages:
  CocoaSpice:
    url: https://github.com/utmapp/CocoaSpice.git
    revision: d8d29fc810047a3ddcebb351cdadc8fe4b4f308d
targets:
  iDeck:
    type: application
    platform: iOS
    sources:
      - path: iDeck
        excludes:
          - "Support/*.entitlements"
      - path: ../core/src
        compilerFlags: ["-std=c++17"]
      - path: ../core/include
        buildPhase: none
    dependencies:
      - package: CocoaSpice
        product: CocoaSpiceNoUsb
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: Compression.framework
      - sdk: AVFoundation.framework
      - sdk: IOSurface.framework
    settings:
      base:
        PRODUCT_NAME: iDeck
        PRODUCT_BUNDLE_IDENTIFIER: $(IDECK_BUNDLE_ID)
        INFOPLIST_FILE: iDeck/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: iDeck/Support/iDeck.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iDeck/Support/iDeck-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        # Embedded frameworks live in Frameworks/; QEMU is dlopen'ed from there.
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        DEAD_CODE_STRIPPING: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          GCC_OPTIMIZATION_LEVEL: s
    postCompileScripts:
      - name: Embed QEMU, graphics and SPICE frameworks
        script: 'bash "${PROJECT_DIR}/scripts/embed_sysroot.sh"'
        basedOnDependencyAnalysis: false
  iDeckTF:
    # TestFlight edition: interpreter-only QEMU (TCI), distribution signing.
    type: application
    platform: iOS
    sources:
      - path: iDeck
        excludes:
          - "Support/*.entitlements"
      - path: ../core/src
        compilerFlags: ["-std=c++17"]
      - path: ../core/include
        buildPhase: none
    dependencies:
      - package: CocoaSpice
        product: CocoaSpiceNoUsb
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: Compression.framework
      - sdk: AVFoundation.framework
      - sdk: IOSurface.framework
    settings:
      base:
        PRODUCT_NAME: iDeck
        PRODUCT_BUNDLE_IDENTIFIER: $(IDECK_BUNDLE_ID)
        INFOPLIST_FILE: iDeck/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: iDeck/Support/iDeck-TestFlight.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iDeck/Support/iDeck-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        IDECK_EDITION: se
        IDECK_SYSROOT_SUFFIX: "-TCI"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
    postCompileScripts:
      - name: Embed QEMU, graphics and SPICE frameworks
        script: 'bash "${PROJECT_DIR}/scripts/embed_sysroot.sh"'
        basedOnDependencyAnalysis: false
schemes:
  iDeck:
    build:
      targets:
        iDeck: all
    archive:
      config: Release
  iDeckTF:
    build:
      targets:
        iDeckTF: all
    archive:
      config: Release
