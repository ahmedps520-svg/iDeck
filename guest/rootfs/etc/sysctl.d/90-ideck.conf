# Steam runtime containers (pressure-vessel/bwrap) need unprivileged user
# namespaces.
kernel.unprivileged_userns_clone = 1
user.max_user_namespaces = 63260
# Some games map very many regions (SteamOS uses the same value).
vm.max_map_count = 2147483642
# The guest has no swap; keep page cache from crowding out games.
vm.swappiness = 0
vm.vfs_cache_pressure = 50
# Fewer background writebacks under emulation.
vm.dirty_writeback_centisecs = 1500
