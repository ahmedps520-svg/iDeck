# virtio-gpu with virgl: modesetting + glamor gives an OpenGL-accelerated
# X server (rendering runs on the iPad GPU through ANGLE/Metal).
Section "Device"
    Identifier "virtio-gpu"
    Driver     "modesetting"
    Option     "AccelMethod" "glamor"
    Option     "DRI" "3"
EndSection

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
