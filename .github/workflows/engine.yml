name: Engine (patched QEMU)

# Builds UTM's QEMU 10.0.12 with iDeck's engine patches (engine/qemu) for
# ARM64 Linux, the same host architecture and TCG backend as the iPad, and
# checks the host-VFP pass-through three ways with the same static binaries:
#   native    on the runner's CPU (real hardware)
#   vfp-off   in a guest, floating point through QEMU's softfloat helpers
#   vfp-on    in a guest, listed instructions run on the host CPU
# The job fails if, with host VFP on, any instruction pattern gives a
# different result from hardware.

on:
  workflow_dispatch:
    inputs:
      fpdump:
        description: Patterns to dump run by run in every environment (comma separated), to debug a mismatch
        default: ""
  push:
    paths:
      - "engine/**"
      - ".github/actions/build-qemu/**"
      - "bench/fpcheck*"
      - "bench/ideck_bench.c"
      - ".github/workflows/engine.yml"

permissions:
  contents: read

env:
  # The published iDeck kernel the guests boot (Image.xz of runtime 0.1.12).
  KERNEL_URL: https://github.com/ahmedps520-svg/iDeck/releases/download/runtime-0.1.12/Image.xz
  KERNEL_SHA256: b92b6a411cd75724614a5a1081cdfe326c2b71abed606ab0138d3270810053c3
  GUEST_CPU: max,pauth=off,sve=off,sme=off

jobs:
  linux-arm64:
    name: Build and compare on ARM64 Linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ziglang==0.14.1
      - name: Unit tests (pattern table, tools)
        run: python -m unittest discover -s engine/tests -v
      - name: Test binaries (static aarch64-linux-musl)
        run: python tools/build_core.py bench --target aarch64-linux-musl
      - name: Busybox for the test initramfs
        run: bash tools/ci_apt.sh busybox-static
      - name: QEMU with the engine patches
        id: qemu
        uses: ./.github/actions/build-qemu
      - name: Kernel
        run: |
          mkdir -p out
          curl -fL --retry 5 -o out/Image.xz "$KERNEL_URL"
          echo "$KERNEL_SHA256  out/Image.xz" | sha256sum -c -
          xz -d out/Image.xz
      - name: Run on the runner's CPU
        run: |
          mkdir -p out/native
          grep -m1 "Features" /proc/cpuinfo
          lscpu | head -20
          build/core/ideck-fpcheck-aarch64-linux-musl > out/native/fpcheck.json
          head -12 out/native/fpcheck.json
          for name in $(echo "${{ inputs.fpdump }}" | tr "," " "); do
            build/core/ideck-fpcheck-aarch64-linux-musl --dump "$name" > "out/native/dump-$name.txt"
          done
          build/core/ideck-bench-aarch64-linux-musl --json > out/native/bench.json
      - name: Guest with QEMU's own floating point (x-host-vfp=off)
        run: |
          python engine/run_guest_tests.py \
            --qemu "${{ steps.qemu.outputs.qemu }}" \
            --kernel out/Image --busybox /usr/bin/busybox \
            --bin build/core/ideck-fpcheck-aarch64-linux-musl:ideck-fpcheck \
            --bin build/core/ideck-bench-aarch64-linux-musl:ideck-bench \
            --cpu "$GUEST_CPU" --out out/vfp-off \
            --append "${{ inputs.fpdump && format('fpdump={0}', inputs.fpdump) || '' }}"
      - name: Guest with host VFP (x-host-vfp=on)
        run: |
          python engine/run_guest_tests.py \
            --qemu "${{ steps.qemu.outputs.qemu }}" \
            --kernel out/Image --busybox /usr/bin/busybox \
            --bin build/core/ideck-fpcheck-aarch64-linux-musl:ideck-fpcheck \
            --bin build/core/ideck-bench-aarch64-linux-musl:ideck-bench \
            --cpu "$GUEST_CPU,x-host-vfp=on" --out out/vfp-on \
            --append "${{ inputs.fpdump && format('fpdump={0}', inputs.fpdump) || '' }}"
      - name: Compare with hardware
        run: |
          python engine/compare.py --native out/native --off out/vfp-off --on out/vfp-on \
            --strict-flags --md "$GITHUB_STEP_SUMMARY"
      - name: Dump differences
        if: always() && inputs.fpdump != ''
        run: |
          for name in $(echo "${{ inputs.fpdump }}" | tr "," " "); do
            for env in vfp-off vfp-on; do
              echo "== $name: native vs $env (first 40 differing lines)"
              diff "out/native/dump-$name.txt" "out/$env/dump-$name.txt" | head -40 || true
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test
          path: |
            out/native
            out/vfp-off
            out/vfp-on
            !out/**/test-initramfs.cpio.gz
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-system-aarch64-linux-arm64
          path: ${{ steps.qemu.outputs.qemu }}
