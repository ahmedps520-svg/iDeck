name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core + agent tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ziglang==0.14.1
      - name: Core unit tests
        run: python tools/build_core.py test
      - name: Guest agent tests (Linux runners include the uinput mapping test)
        run: python tools/build_core.py agent
      - name: Fetch the live ARM64 Steam client manifest (format test)
        if: runner.os == 'Linux'
        run: curl -fsSL -o "$RUNNER_TEMP/steam_client_linuxarm64" https://client-update.steamstatic.com/steam_client_linuxarm64
      - name: Guest Python tests
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/steam_client_linuxarm64" ]; then export IDECK_STEAM_MANIFEST="$RUNNER_TEMP/steam_client_linuxarm64"; fi
          python -m unittest discover -s guest/tests -v

  apple-clang:
    name: Core with AppleClang (CMake)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S core -B build/cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cmake -j
      - run: ctest --test-dir build/cmake --output-on-failure

  shm-fallback:
    name: GPU shared memory fallback (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build/shm
          clang -O1 -g -Wall -Wextra -Werror -dynamiclib -o build/shm/libshm_user.dylib ios/tests/shm_fallback/shm_user.c
          clang -O1 -g -Wall -Wextra -Werror -I ios/iDeck/Native -o build/shm/shm_fallback_test \
            ios/tests/shm_fallback/test_main.c ios/iDeck/Native/IDSharedMemoryFallback.c
          # The library must import shm_open through a symbol pointer, as the
          # iOS frameworks do (checked there with tools in TEST_RESULTS.md).
          nm -u build/shm/libshm_user.dylib | grep -x '_shm_open'
      - name: Every allocation file-backed
        run: build/shm/shm_fallback_test always "$PWD/build/shm/libshm_user.dylib"
      - name: POSIX shared memory refused by the sandbox (as on iOS without an app group)
        run: |
          sandbox-exec -p '(version 1)(allow default)(deny ipc-posix-shm*)' \
            build/shm/shm_fallback_test denied "$PWD/build/shm/libshm_user.dylib" | tee build/shm/denied.txt
          if grep -q '^SKIP' build/shm/denied.txt; then echo "::warning::sandbox-exec did not refuse shm_open"; fi

  log-parsers:
    name: Session and Steam update log parsing (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build/parsers
          swiftc -warnings-as-errors -o build/parsers/log_parsers \
            ios/iDeck/Runtime/LogParsers.swift ios/tests/log_parsers/main.swift
      - name: Run
        run: build/parsers/log_parsers

  guest-binaries:
    name: Guest binaries (aarch64-linux-musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ziglang==0.14.1
      - run: python tools/build_core.py all --target aarch64-linux-musl
      - name: Run the arm64 test binaries under qemu-user
        run: |
          bash tools/ci_apt.sh qemu-user-static
          qemu-aarch64-static build/core/ideck_core_tests-aarch64-linux-musl
          qemu-aarch64-static build/core/ideck_agent_tests-aarch64-linux-musl
          qemu-aarch64-static build/core/ideck-bench-aarch64-linux-musl --quick
      - uses: actions/upload-artifact@v4
        with:
          name: guest-binaries-aarch64
          path: |
            build/core/ideck-agent-aarch64-linux-musl
            build/core/ideck-bench-aarch64-linux-musl

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -S warning linux/build-image.sh ios/scripts/*.sh tools/ci_apt.sh \
            guest/rootfs/usr/lib/ideck/ideck-steam-launch guest/rootfs/usr/lib/ideck/ideck-steam-url \
            guest/rootfs/usr/lib/ideck/session guest/rootfs/usr/lib/ideck/set-resolution guest/rootfs/usr/lib/ideck/init-home \
            guest/rootfs/usr/lib/ideck/zram-swap
      - name: Python syntax
        run: python3 -m py_compile guest/rootfs/usr/lib/ideck/*.py tools/*.py linux/*.py
      - name: systemd units
        run: |
          bash tools/ci_apt.sh systemd
          systemd-analyze verify --man=no guest/rootfs/etc/systemd/system/*.service || true
