name: Linux runtime

# Builds the guest image natively on an arm64 runner, boot-tests it under
# QEMU (TCG, the same emulation mode iDeck uses on the iPad), runs the guest
# provisioning (installs the real ARM64 Steam client), benchmarks the
# emulated CPU, and publishes the artifacts plus the manifest the app reads.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime version (e.g. 0.1.0)
        required: true
        default: "0.1.0"
      publish:
        description: Publish as a GitHub release (runtime-<version> and runtime-latest)
        type: boolean
        default: false
      steam_software_ui:
        description: Boot test only - start Steam with its software-rendered UI (the app's default)
        type: boolean
        default: false
      kernel_ab:
        description: Also run the kernel/CPU-model benchmark A/B boots (~15 min)
        type: boolean
        default: false
      tb_cache_mb:
        description: Boot test only - TCG translation cache in MiB (384 on the iPad up to build 30, 1024 from build 31)
        default: "1024"
      cpu_model:
        description: Boot test only - QEMU CPU model (max is the app's default from build 33)
        default: max
      host_vfp:
        description: Boot test only - iDeck's QEMU with native floating point and kept kernel TLB entries (the app's defaults from build 37); off = Ubuntu's QEMU
        type: boolean
        default: true
      engine_options:
        description: Boot test only - with iDeck's QEMU, switch its options on (off = the same QEMU with stock behaviour, as a control)
        type: boolean
        default: true
      boot_test:
        description: Run the boot test (adds ~1-3 hours)
        type: boolean
        default: true
  push:
    tags: ["runtime-*"]

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V="${GITHUB_REF_NAME#runtime-}"; else V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build guest agent, benchmark and core library
        run: |
          python -m pip install ziglang==0.14.1
          python tools/build_core.py agent --target aarch64-linux-musl
          python tools/build_core.py bench --target aarch64-linux-musl
          python tools/build_core.py lib
      # The same QEMU source and patches as the iPad's (engine/qemu), built
      # for this ARM64 runner: the boot test then runs the engine the app ships.
      - name: QEMU with the engine patches
        id: qemu
        if: github.event_name == 'push' || inputs.host_vfp
        uses: ./.github/actions/build-qemu
      - name: Host packages
        run: |
          bash tools/ci_apt.sh mmdebstrap debian-archive-keyring e2fsprogs qemu-system-arm qemu-utils
      - name: Build image
        run: |
          sudo bash linux/build-image.sh --version "${{ steps.v.outputs.version }}" \
            --agent build/core/ideck-agent-aarch64-linux-musl \
            --bench build/core/ideck-bench-aarch64-linux-musl \
            --fpcheck build/core/ideck-fpcheck-aarch64-linux-musl --out out
          sudo chown -R "$USER" out
          ls -la out
      - name: Kernel and CPU model benchmark (A/B boots without provisioning)
        if: inputs.kernel_ab
        continue-on-error: true
        timeout-minutes: 45
        run: |
          variant() {
            python3 tools/ideck_host.py --core build/core/libideck_core.so --runtime out \
              --report "out/boot-test/bench-$1" --memory 4096 --cpus 4 --bench-only "${@:2}" \
              > "out/bench-$1.log" 2>&1 || echo "::warning::benchmark variant $1 failed"
          }
          mkdir -p out/boot-test
          # Same kernel command line as the device; only the CPU model differs.
          # "max" (PAuth/SVE/SME off) adds FEAT_MOPS, which glibc uses for
          # memcpy (mem_copy_glibc). kpti A/B: run 43218566550.
          variant n1 --cpu-model neoverse-n1
          variant max --cpu-model max
          # iDeck's QEMU build (engine/qemu): the same binary with its
          # floating point in helpers and on the host CPU. Each run also
          # checks every FP instruction pattern against the hardware
          # reference in the image (fpcheck in the report).
          Q="${{ steps.qemu.outputs.qemu }}"
          if [ -n "$Q" ]; then
            variant engine-helpers --cpu-model max --qemu "$Q"
            variant engine-native-fp --cpu-model max --qemu "$Q" --host-vfp
            variant engine-native-fp-tlb --cpu-model max --qemu "$Q" --host-vfp --tlb-keep-global
          fi
          python3 - <<'PY'
          import json, pathlib
          for d in sorted(pathlib.Path("out/boot-test").glob("bench-*")):
              try:
                  r = json.loads((d / "report.json").read_text())
              except (OSError, ValueError) as e:
                  print(d.name, "no report:", e)
                  continue
              print(f"{d.name}: boot {r.get('boot_seconds')} s; kpti: {r.get('kpti')!r}")
              fp = r.get("fpcheck") or {}
              print(f"    fpcheck: match {fp.get('match')}, flags {fp.get('flags_match')}, "
                    f"{fp.get('patterns')} patterns, {fp.get('seconds')} s + {fp.get('mix_seconds')} s")
              print("   ", json.dumps(r.get("bench")))
          PY
      - name: Boot test (QEMU TCG, provisioning, Steam, benchmark)
        id: boot
        if: github.event_name == 'push' || inputs.boot_test
        continue-on-error: true
        timeout-minutes: 240
        run: |
          # Watch 5 more minutes after Steam's window appears: its first update
          # check (about 2 min after start) shows whether it installs again.
          # tb_cache_mb: the TCG cache size to test (384 MiB is what a 4 GiB
          # guest got on the iPad up to build 30, 1024 from build 31); the
          # Zink check restarts Steam with its UI drawn through Zink (CI's
          # Vulkan is lavapipe, so it checks that it draws, not the speed).
          EXTRA="--steam-observe 300 --tb-cache-mb ${{ inputs.tb_cache_mb || '1024' }} --steam-zink-check"
          EXTRA="$EXTRA --cpu-model ${{ inputs.cpu_model || 'max' }}"
          if [ -n "${{ steps.qemu.outputs.qemu }}" ]; then
            EXTRA="$EXTRA --qemu ${{ steps.qemu.outputs.qemu }}"
            # A push (tag) has no inputs: options on.
            if [ "${{ inputs.engine_options }}" != "false" ]; then
              EXTRA="$EXTRA --host-vfp --tlb-keep-global"
            fi
          fi
          if [ "${{ inputs.steam_software_ui }}" = "true" ]; then
            EXTRA="$EXTRA --steam-software-ui"
          else
            EXTRA="$EXTRA --steam-apply-update"
          fi
          # shellcheck disable=SC2086
          python3 tools/ideck_host.py --core build/core/libideck_core.so --runtime out \
            --report out/boot-test --memory 4096 --cpus 4 $EXTRA
      - name: Report boot test outcome
        if: steps.boot.outcome == 'failure'
        run: |
          echo "::warning title=Boot test failed::The runtime image was built but the QEMU boot test failed; see the boot-test artifact and this step's log."
          tail -n 40 out/boot-test/report.json 2>/dev/null || true
      - name: Compress and write manifest
        run: |
          V="${{ steps.v.outputs.version }}"
          python3 tools/make_manifest.py --version "$V" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/runtime-$V" \
            --out dist --kernel out/Image --initrd out/initrd.img --system out/system.img \
            --guest-info out/guest-info.json
          cp out/packages.lock dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test-${{ steps.v.outputs.version }}
          path: out/boot-test
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ steps.v.outputs.version }}
          path: dist
          compression-level: 0
      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          NOTES="iDeck Linux runtime $V (Debian 13 arm64). Boot-test report is attached to the workflow run."
          gh release create "runtime-$V" dist/* --title "iDeck runtime $V" --notes "$NOTES" --prerelease || \
            gh release upload "runtime-$V" dist/* --clobber
          # Stable URL the app reads: releases/download/runtime-latest/manifest.json
          gh release view runtime-latest >/dev/null 2>&1 || \
            gh release create runtime-latest --title "iDeck runtime (latest)" --notes "Points to the newest runtime." --prerelease
          gh release upload runtime-latest dist/manifest.json --clobber
