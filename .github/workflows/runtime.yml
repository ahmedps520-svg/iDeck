name: Linux runtime

# Builds the guest image natively on an arm64 runner, boot-tests it under
# QEMU (TCG, the same emulation mode iDeck uses on the iPad), runs the guest
# provisioning (installs the real ARM64 Steam client), benchmarks the
# emulated CPU, and publishes the artifacts plus the manifest the app reads.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime version (e.g. 0.1.0)
        required: true
        default: "0.1.0"
      publish:
        description: Publish as a GitHub release (runtime-<version> and runtime-latest)
        type: boolean
        default: false
      steam_software_ui:
        description: Boot test only - start Steam with its software-rendered UI and watch it for 30 more minutes
        type: boolean
        default: false
      boot_test:
        description: Run the boot test (adds ~1-3 hours)
        type: boolean
        default: true
  push:
    tags: ["runtime-*"]

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V="${GITHUB_REF_NAME#runtime-}"; else V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build guest agent, benchmark and core library
        run: |
          python -m pip install ziglang==0.14.1
          python tools/build_core.py agent --target aarch64-linux-musl
          python tools/build_core.py bench --target aarch64-linux-musl
          python tools/build_core.py lib
      - name: Host packages
        run: |
          bash tools/ci_apt.sh mmdebstrap debian-archive-keyring e2fsprogs qemu-system-arm qemu-utils
      - name: Build image
        run: |
          sudo bash linux/build-image.sh --version "${{ steps.v.outputs.version }}" \
            --agent build/core/ideck-agent-aarch64-linux-musl \
            --bench build/core/ideck-bench-aarch64-linux-musl --out out
          sudo chown -R "$USER" out
          ls -la out
      - name: Boot test (QEMU TCG, provisioning, Steam, benchmark)
        id: boot
        if: github.event_name == 'push' || inputs.boot_test
        continue-on-error: true
        timeout-minutes: 240
        run: |
          EXTRA=""
          if [ "${{ inputs.steam_software_ui }}" = "true" ]; then EXTRA="--steam-software-ui --steam-observe 1800"; fi
          # shellcheck disable=SC2086
          python3 tools/ideck_host.py --core build/core/libideck_core.so --runtime out \
            --report out/boot-test --memory 4096 --cpus 4 $EXTRA
      - name: Report boot test outcome
        if: steps.boot.outcome == 'failure'
        run: |
          echo "::warning title=Boot test failed::The runtime image was built but the QEMU boot test failed; see the boot-test artifact and this step's log."
          tail -n 40 out/boot-test/report.json 2>/dev/null || true
      - name: Compress and write manifest
        run: |
          V="${{ steps.v.outputs.version }}"
          python3 tools/make_manifest.py --version "$V" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/runtime-$V" \
            --out dist --kernel out/Image --initrd out/initrd.img --system out/system.img \
            --guest-info out/guest-info.json
          cp out/packages.lock dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test-${{ steps.v.outputs.version }}
          path: out/boot-test
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ steps.v.outputs.version }}
          path: dist
          compression-level: 0
      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          NOTES="iDeck Linux runtime $V (Debian 13 arm64). Boot-test report is attached to the workflow run."
          gh release create "runtime-$V" dist/* --title "iDeck runtime $V" --notes "$NOTES" --prerelease || \
            gh release upload "runtime-$V" dist/* --clobber
          # Stable URL the app reads: releases/download/runtime-latest/manifest.json
          gh release view runtime-latest >/dev/null 2>&1 || \
            gh release create runtime-latest --title "iDeck runtime (latest)" --notes "Points to the newest runtime." --prerelease
          gh release upload runtime-latest dist/manifest.json --clobber
